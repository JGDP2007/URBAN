<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>URBAN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
/* RESET */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    display: flex;
}

/* CONTAINER */
.container {
    max-width: 1200px;
    margin: auto;
    padding: 15px;
}

/* SIDEBAR */
.sidebar {
    width: 240px;
    background: #111;
    color: white;
    height: 100vh;
    position: fixed;
    padding-top: 20px;
    z-index: 1000;
    transition: 0.3s;
}

.sidebar h2 {
    padding: 0 20px;
    margin-bottom: 30px;
}

.sidebar a {
    display: flex;
    align-items: center;
    color: #ccc;
    padding: 15px 20px;
    text-decoration: none;
}

.sidebar a:hover {
    background: #222;
    color: white;
}

/* MAIN CONTENT */
.main {
    margin-left: 240px;
    width: calc(100% - 240px);
    padding: 30px;
}

/* CARDS */
.card {
    background: white;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

/* FLEX */
.flex {
    display: flex;
    gap: 15px;
}

/* BUTTONS */
.btn {
    padding: 10px 15px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
}

.btn-primary {
    background: #6366f1;
    color: white;
}

.btn-danger {
    background: #ef4444;
    color: white;
}

/* INPUTS */
input, textarea, select {
    width: 100%;
    padding: 10px;
    margin: 8px 0 15px;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 16px;
}

/* TASK ROW */
.task-row {
    background: white;
    padding: 15px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    border: 1px solid #ddd;
}

/* TASK ACTIONS */
.task-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

/* PROGRESS */
.progress-bar {
    background: #ddd;
    height: 20px;
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    background: #22c55e;
    height: 100%;
}

/* PROJECT CARD */
.project-card {
    display: flex;
    border-radius: 20px;
    overflow: hidden;
}

/* MOBILE TOP BAR */
.mobile-topbar {
    display: none;
    position: fixed;
    top: 0;
    width: 100%;
    background: #111;
    color: white;
    padding: 12px;
    z-index: 1100;
    align-items: center;
    gap: 10px;
}

/* OVERLAY */
#overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    display: none;
    z-index: 999;
}

/* ================= MOBILE ================= */
@media (max-width: 768px) {

    body {
        display: block;
    }

    .mobile-topbar {
        display: flex;
    }

    .sidebar {
        left: -240px;
    }

    .sidebar.active {
        left: 0;
    }

    #overlay.active {
        display: block;
    }

    .main {
        margin-left: 0;
        width: 100%;
        padding: 15px;
        margin-top: 60px;
    }

    .flex {
        flex-direction: column;
    }

    .task-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }

    .project-card {
        flex-direction: column;
    }

    button, a {
        min-height: 44px;
    }
}
    </style>
</head>

<body>
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="container">
      <div class="card">
        {% for message in messages %}
          <p>{{ message }}</p>
        {% endfor %}
      </div>
    </div>
  {% endif %}
{% endwith %}
    <!-- ✅ MOBILE TOP BAR -->
    <div class="mobile-topbar">
        <button onclick="toggleSidebar()">☰</button>
        <span>URBAN</span>
    </div>

    <!-- ✅ OVERLAY -->
    <div id="overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar">
        <h2>URBAN</h2>
        <a href="{{ url_for('dashboard') }}"><i class="fa-solid fa-chart-simple"></i> Dashboard</a>
        <a href="{{ url_for('dashboard') }}"><i class="fa-solid fa-thumbtack"></i> My Projects</a>
        <a href="{{ url_for('my_tasks') }}"><i class="fa-solid fa-thumbtack"></i> My Tasks</a>
        <a href="{{ url_for('logout') }}" style="margin-top:50px;"><i class="fa-solid fa-square"></i> Logout</a>
    </div>

    <div class="main">

        <!-- (kept your button, just hidden on mobile) -->
        <button class="menu-btn" onclick="toggleSidebar()">☰ Menu</button>

        {% block content %}{% endblock %}
    </div>

    <!-- ✅ IMPROVED SIDEBAR TOGGLE -->
    <script>
function toggleSidebar() {
    document.querySelector('.sidebar').classList.toggle('active');
    document.getElementById('overlay').classList.toggle('active');
}
</script>

</body>
</html>
